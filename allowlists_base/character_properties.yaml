    category: Arousal
    notes: |
      Global arousal, a number (roughly 0..1) — use the Compare row, e.g.
      `>= 0.5`. Bare (no comparison) means "aroused at all".
    source_file: game/core/definitions/companions.rpy
    source_line: 223

