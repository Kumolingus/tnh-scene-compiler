# Read-only character properties usable bare in a condition, e.g.
# `[[if JeanGrey.desire >= 0.5]]`. These are `@property` accessors on the
# base game's CompanionClass — no parentheses, no side effects — so they sit
# between the DSL sugar (`.love`/`.mood`/`.nearby`) and the called
# `character_methods.yaml`.
#
# Hand-maintained (no extractor), same as character_methods.yaml. Adding an
# entry both (1) lets the validator accept `Character.<name>` in a condition
# and (2) exposes it in the Condition Builder's "Character property" type.
# The validator only checks the property NAME (like traits) — it does not
# enforce which characters actually have it (these live on companions, not
# every NPC/Player), so the writer is responsible for using them on a
# companion.
#
# `type` drives the Condition Builder's comparison affordance (int/float are
# comparable, so it offers an operator + value). `category` groups the
# pick-list; `notes` is an optional per-selection hint.
source: TNH base game
generated_at: '2026-07-20'
properties:
  # -- Approval -----------------------------------------------------------
  # The raw int approval values. `Character.love >= tier_name` (small,
  # medium, ...) is better expressed via the "Love / Trust check" condition
  # type, which fills in the tier for you; these entries cover the bare
  # numeric form (`Character.love >= 500`) and keep the validator from
  # rejecting it.
  - name: love
    type: int
    category: Approval
    notes: "Raw love value (int). For tier names, prefer the Love/Trust check type."
    source_file: game/core/definitions/companions.rpy
    source_line: 9
  - name: trust
    type: int
    category: Approval
    notes: "Raw trust value (int). For tier names, prefer the Love/Trust check type."
    source_file: game/core/definitions/companions.rpy
    source_line: 10

