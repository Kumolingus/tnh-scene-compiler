# Character methods callable in [[if Character.method()]] conditions.
# Only read-only methods suitable for branching logic are listed.
# Side-effect methods (give_trait, change_mood, etc.) are excluded.
#
# ``category`` groups entries in the editor's Condition Builder
# (Character method type). Optional — an entry without one falls back
# to an "Other" bucket in the GUI.
#
# ``param_choices`` declares, per parameter, the values the builder offers
# as a dropdown (still editable — a suggestion list, not a whitelist).
# A parameter maps to either a fixed list, or a dynamic source mapping
# ``{source: <allowlist set>, quote: true}`` resolved at render time so the
# suggestions track the game/mod data instead of being copied here.
# Sources: history_events, traits, personalities, characters, locations,
# looks, stages, sfx, inventory_items, features, clothing_items,
# inventory_strings. All are the same list for every character except
# ``features`` (see features/<Character>.yaml), ``clothing_items`` (see
# clothing_items/<Character>.yaml) and ``inventory_strings`` (the union of
# the flat items and that character's clothing), which are narrowed to the
# character selected in the form.
#
# Some methods here are what a friendlier built-in check compiles to:
# check_trait / check_personality / get_status / is_in_normal_mood are the
# Trait, Personality and Mood checks (see dsl.py), so a writer should normally
# reach for those. They stay listed because the "Character method (any)"
# picker is the escape hatch for a caller who needs the raw form — and they
# carry ``param_choices`` like everything else: an entry that is listed should
# not be harder to fill than the one next to it just because it duplicates
# something. "Do not promote it" is not a reason to leave its form worse.
source: TNH base game
generated_at: '2026-05-13'
methods:
  # -- Traits (BaseClass / TraitClass) ------------------------------------
  - name: check_trait
    category: Traits
    signature: "Character.check_trait(trait: str) -> bool"
    notes: |
      Whether the character has the trait at all. This is exactly what the
      Trait check does — prefer that one; this raw form is here for a caller
      who needs it.
    param_choices:
      trait:
        source: traits
        quote: true
    source_file: game/core/definitions/base.rpy
    source_line: 91
  - name: get_trait
    category: Traits
    signature: "Character.get_trait(trait: str, default = None) -> Any"
    notes: |
      Reads a trait's stored VALUE (not a yes/no — that is the Trait check).
      Returns `default` when the character has no such trait, so compare it
      against what the trait holds rather than testing it bare.
    param_choices:
      trait:
        source: traits
        quote: true
    source_file: game/core/definitions/base.rpy
    source_line: 99

  # -- Personality (CharacterClass) ---------------------------------------
  - name: check_personality
    category: Personality
    signature: "Character.check_personality(trait: str, threshold: int | None = None) -> bool | int"
    notes: |
      A personality score, or a yes/no against a threshold. Scores are small
      integers (commonly -1, 0, 1; higher = stronger), so give a threshold
      (e.g. 1) for a clear yes/no — left at None it returns the raw score,
      which reads as true for -1 too. The Personality check is the friendlier
      form of this.
    param_choices:
      trait:
        source: personalities
        quote: true
    source_file: game/core/definitions/characters.rpy
    source_line: 79

  # -- Mood and status (NPCClass) -----------------------------------------
  - name: is_in_normal_mood
    category: Mood and status
    signature: "Character.is_in_normal_mood(check_alone_time: bool = True) -> bool"
    source_file: game/core/definitions/npcs.rpy
    source_line: 93
  - name: get_status
    category: Mood and status
    signature: "Character.get_status() -> str | None"
    source_file: game/core/definitions/npcs.rpy
    source_line: 83
  - name: default_mood
    category: Mood and status
    signature: "Character.default_mood() -> str"
    source_file: game/core/definitions/npcs.rpy
    source_line: 102

  # -- Relationships (NPCClass) -------------------------------------------
  # Delegates straight to get_Characters_opinion (npcs.rpy:379), so it returns
  # a FriendshipTier and NOT a raw score — the earlier "e.g. >= 50" note sent
  # writers toward a condition that can never be true (the scale tops out at 3).
  - name: get_friendship
    category: Relationships
    signature: "Character.get_friendship(Character: CharacterClass) -> FriendshipTier"
    notes: |
      This character's opinion of the other one, as a TIER number — not a raw
      score. Scale: enemies=-2, rivals=-1, acquaintances=0, friends=1, good
      friends=2, best friends=3. Use the Compare row, e.g. `>= 2` for "at least
      good friends". One-directional: A's opinion of B is not B's opinion of A.
      "Opinion of another (tier)" under Relationships is the same check with a
      friendlier form.
    source_file: game/core/definitions/npcs.rpy
    source_line: 378

  # -- Features (NPCClass) ------------------------------------------------
  - name: feature_enabled
    category: Features
    signature: "Character.feature_enabled(feature_name: str) -> bool"
    notes: |
      True when the character supports a named feature (e.g. "date", "flirt",
      "texting", "sleepover"). The list is that character's own — the sets vary
      a lot, from 2 entries to 23, and share no common value — so it changes
      when you change the character above. A trait of the same name also
      counts, which is why the list is a suggestion and stays editable.
    param_choices:
      feature_name:
        source: features
        quote: true
    source_file: game/core/definitions/npcs.rpy
    source_line: 443

  # -- History (via Character.History) -------------------------------------
  # The tracker lists below are HistoryClass.TRACKER_NAMES (history.rpy:13),
  # kept in the source's declaration order (shortest window first). Quoted with
  # single quotes so the prefilled 'persistent' default matches an entry of the
  # dropdown it is shown in.
  - name: check
    category: History
    signature: "Character.History.check(Item: str, tracker: str = 'persistent', after = 0) -> int"
    notes: |
      How many times the character did this, as a COUNT — use the Compare row
      (e.g. `>= 2` for "at least twice"). The History check does the same thing
      for the simple "has she ever done it" case; reach for this one when you
      need the count, or a shorter window than the whole save.
      tracker picks that window: 'persistent' (default) is the whole save,
      'permanent' survives even a reset, and the others narrow it down to a
      season, chapter, week, day, or the current event. after is a day number —
      leave it at 0 for "no lower bound".
    param_choices:
      Item:
        source: history_events
        quote: true
      tracker:
        - "'immediate'"
        - "'event'"
        - "'recent'"
        - "'last'"
        - "'yesterday'"
        - "'daily'"
        - "'weekly'"
        - "'season'"
        - "'chapter'"
        - "'persistent'"
        - "'permanent'"
    source_file: game/core/definitions/history.rpy
    source_line: 48
  - name: check_when
    category: History
    signature: "Character.History.check_when(item: str, tracker: str = 'persistent') -> tuple[int, int, float]"
    notes: |
      WHEN it last happened, as a moment in game time — not a yes/no and not a
      count. Feed it to "Periods since a date" to turn it into an age, e.g.
      get_time_since(JeanGrey.History.check_when("kissed_player")) >= 4 for
      "at least about a day ago". Careful: an event that never happened gives
      (-1, -1, -1.0), which reads as a very long time ago — check it happened
      at all first. Same tracker windows as the History count check.
    param_choices:
      item:
        source: history_events
        quote: true
      tracker:
        - "'immediate'"
        - "'event'"
        - "'recent'"
        - "'last'"
        - "'yesterday'"
        - "'daily'"
        - "'weekly'"
        - "'season'"
        - "'chapter'"
        - "'persistent'"
        - "'permanent'"
    source_file: game/core/definitions/history.rpy
    source_line: 67

  # -- Inventory (via Character.Inventory) ---------------------------------
  # ``filter`` is matched against the item's filter_type (inventory.rpy:103).
  # The base game only ever sets two, and all 58 of its items set one — but an
  # item with no filter_type would raise on `filter in None`, so a project
  # adding items should keep setting it.
  # ``string`` suggests both kinds of thing an inventory holds: plain items,
  # keyed by Item.string (the flat inventory_items allowlist), and clothing,
  # keyed by Item.tag (inventory.rpy:79-82) — i.e. "<Owner>_<id>", which is
  # what the per-character clothing_items allowlist carries. One lookup
  # reaches both, so the dropdown offers both.
  - name: get_active
    category: Inventory
    signature: "Character.Inventory.get_active(string: str, filter: str | None = None, Owner: Any = False) -> bool"
    notes: |
      Whether the character has this item and it is currently active (worn,
      switched on…). string is the item's key, e.g. "flowers". Leave filter at
      None unless you mean to narrow to gifts. Owner stays False for "anyone's
      copy"; give a character to require that they own it.
    param_choices:
      string:
        source: inventory_strings
        quote: true
      filter:
        - "None"
        - '"gifts"'
        - '"key_gifts"'
    source_file: game/core/definitions/inventory.rpy
    source_line: 113
  - name: get_number
    category: Inventory
    signature: "Character.Inventory.get_number(string: str, filter: str | None = None, Owner: Any = False) -> int"
    notes: |
      How many of this item the character holds — a COUNT, so use the Compare
      row (e.g. `>= 1` for "has at least one"). Same string / filter / Owner
      rules as the active check.
    param_choices:
      string:
        source: inventory_strings
        quote: true
      filter:
        - "None"
        - '"gifts"'
        - '"key_gifts"'
    source_file: game/core/definitions/inventory.rpy
    source_line: 110
