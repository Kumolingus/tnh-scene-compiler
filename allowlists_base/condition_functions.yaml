# Functions callable from [[if]] expressions inside a .scene file.
# Every entry is an explicit contract: adding a function here exposes
# it to non-dev writers, and the mod commits to keeping its signature
# stable across releases.
#
# Only standalone (non-method) functions are listed here. Character
# methods like JeanGrey.is_in_normal_mood() are accessed via attribute
# syntax and validated separately.
#
# ``category`` groups entries in the editor's Condition Builder
# (Standalone function type). Optional — an entry without one falls
# back to an "Other" bucket in the GUI.
