    signature: "get_max_friendship(A: Character, B: Character) -> FriendshipTier"
    notes: |
      Highest tier the pair ever reached. Returns a tier number — use the
      Compare row. Scale: enemies=-2 ... best friends=3.
    source_file: game/core/mechanics/friendship.rpy
    source_line: 131

