# Functions callable from [[if]] expressions inside a .scene file.
# Every entry is an explicit contract: adding a function here exposes
# it to non-dev writers, and the mod commits to keeping its signature
# stable across releases.
#
# Only standalone (non-method) functions are listed here. Character
# methods like JeanGrey.is_in_normal_mood() are accessed via attribute
# syntax and validated separately.
#
# ``category`` routes the function into a top-level condition category of
# the editor's Condition Builder (Relationships, Location & time, …), where
# it becomes an entry of its own in the "Condition type" selector. Every
# function is promoted this way — one with no ``category`` lands under
# "Advanced" — so this is the *only* place a writer picks it from; there is
# no generic "any function" list behind it.
# ``label`` is the friendly display name shown there (falls back to the
# function name). Both optional.
source: TNH base game
generated_at: '2026-05-13'
functions:
  # -- Approval -------------------------------------------------------------
  # The real function takes three more parameters (extra_condition, multiplier,
  # default) that are deliberately not declared here: every declared parameter
  # is emitted into the call, so exposing them would write
  # `check_approval(A, None, 500, None, 1.0, (0, 0))` for no gain. The defaults
  # below are load-bearing for the same reason — without them the builder emits
  # an empty argument (`check_approval(A, , )`) when a field is left untouched.
  - name: check_approval
    category: Approval
    label: "Love / trust (combined or by tier)"
    signature: "check_approval(Character, flavor: str | None = None, threshold: str | int | None = None) -> bool | int | float"
    notes: |
      The full approval check, for what the simple Love / Trust check cannot
      say. Leave flavor at None to test love and trust ADDED TOGETHER; set it
      to "love" or "trust" for one axis alone. threshold takes either a plain
      number, or the name of one of the character's relationship thresholds
      ("friendship", "dating", "relationship", "love") — the named form checks
      love AND trust against that tier's own pair of values, which is how the
      game gates its own content. Left at None it returns the raw number
      instead, so use the Compare row.
    param_choices:
      flavor:
        - "None"
        - '"love"'
        - '"trust"'
      threshold:
        - "None"
        - '"warm"'
        - '"friendship"'
        - '"dating"'
        - '"relationship"'
        - '"love"'
    source_file: game/core/mechanics/approval.rpy
    source_line: 16

  # -- Relationships ----------------------------------------------------------
  - name: are_Characters_friends
    category: Relationships
    label: "Friends (a group, at a tier)"
    signature: "are_Characters_friends(Characters, level: int = 1) -> bool"
    notes: |
      True when EVERY pair in the group is friends at least at `level`. The
      simple Friendship check is this function with two characters at level 1;
      use this one to check a whole group, or to demand more than plain
      friendship. Scale: 1 friends, 2 good friends, 3 best friends.
    param_choices:
      level:
        - "1"
        - "2"
        - "3"
    source_file: game/core/mechanics/friendship.rpy
    source_line: 15
  # Two entries, not one. `knows_about` does not refine the question, it
  # replaces it: left at the game's default the call also walks every OTHER
  # partner and fails on the first one who has not been told about the
  # character being asked about. So "is she my girlfriend" returns False for
  # someone who *is* a partner, as soon as a second partner exists who does
  # not know. That is a polyamory-disclosure audit — a real thing to ask,
  # and a different goal, so it gets its own name instead of a boolean the
  # writer has to know the base game to interpret.
  #
  # `Characters` is declared "pick" because this function asks about named
  # characters. The signature-derived default (a required collection leads
  # with "everyone present here") is right for are_Characters_friends and
  # check_if_need_to_change, and here would ask "is everyone in the room my
  # partner".
  - name: are_Characters_in_Partners
    category: Relationships
    label: "In a relationship"
    signature: "are_Characters_in_Partners(Characters, knows_about: bool = True) -> bool"
    notes: |
      True if every listed character is one of the player's partners. With
      knows_about (default True) it also requires the partners to know about
      each other's relationship with the player; set it False to skip that.
    param_collection_mode:
      Characters: pick
    variants:
      - label: "In a relationship"
        fixed:
          knows_about: "False"
        notes: |
          True when every character you list is one of the player's
          partners. This is the plain "are they together" check — the game
          asks it as `JeanGrey in Partners` in hundreds of its own
          conditions. It does not care who else knows.
      - label: "In a relationship, and the others know"
        fixed:
          knows_about: "True"
        notes: |
          Everyone you list is a partner of the player AND every other
          partner has been told about them. Use it for a scene that assumes
          the situation is out in the open — with only one partner it is the
          same as the plain check, with two it also asks whether the player
          has come clean. It is False while a disclosure is still pending,
          even though the relationship itself is real.
    source_file: game/core/mechanics/friendship.rpy
    source_line: 24
  - name: get_best_Friend
    category: Relationships
    label: "Best friend (of a group)"
    signature: "get_best_Friend(Character, Characters) -> Character | None"
    notes: |
      Of the characters in the group, the one the first character likes most
      (highest effective friendship). Returns a Character, or None when the
      group is empty — in an [[if]] it is truthy once someone qualifies.
    source_file: game/core/mechanics/friendship.rpy
    source_line: 53
  - name: get_worst_Enemy
    category: Relationships
    label: "Worst enemy (of a group)"
    signature: "get_worst_Enemy(Character, Characters) -> Character | None"
    notes: |
      Of the characters in the group, the one the first character likes least
      (lowest effective friendship). Returns a Character, or None when the
      group is empty.
    source_file: game/core/mechanics/friendship.rpy
    source_line: 72
  # The 4 below return a FriendshipTier (IntEnum: Enemies=-2, Rivals=-1,
  # Acquaintances=0, Friends=1, GoodFriends=2, BestFriends=3), so a writer
  # compares against a plain integer, e.g. get_effective_friendship(A, B)
  # >= 2 for "at least good friends". FriendshipTier.Friends etc. can't be
  # used as a bare name — the compiler would resolve it as scene-local state.
  # Params are typed "A: Character, B: Character" (not the bare "Character"
  # name run_operations.yaml uses) so the editor's per-parameter form renders
  # a character-picker dropdown for both, not just a first bare-named one.
  - name: get_effective_friendship
    category: Relationships
    label: "Effective friendship (tier)"
    signature: "get_effective_friendship(A: Character, B: Character) -> FriendshipTier"
    notes: |
      Returns a tier number — use the Compare row (e.g. `>= 2`). Scale:
      enemies=-2, rivals=-1, acquaintances=0, friends=1, good friends=2,
      best friends=3.
    source_file: game/core/mechanics/friendship.rpy
    source_line: 115
  - name: get_Characters_opinion
    category: Relationships
