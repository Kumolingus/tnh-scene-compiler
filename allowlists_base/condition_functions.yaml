# Functions callable from [[if]] expressions inside a .scene file.
# Every entry is an explicit contract: adding a function here exposes
# it to non-dev writers, and the mod commits to keeping its signature
# stable across releases.
#
# Only standalone (non-method) functions are listed here. Character
# methods like JeanGrey.is_in_normal_mood() are accessed via attribute
# syntax and validated separately.
#
# ``category`` routes the function into a top-level condition category of
# the editor's Condition Builder (Relationships, Location & time, …), where
# it becomes an entry of its own in the "Condition type" selector. Every
# function is promoted this way — one with no ``category`` lands under
# "Advanced" — so this is the *only* place a writer picks it from; there is
# no generic "any function" list behind it.
# ``label`` is the friendly display name shown there (falls back to the
# function name). Both optional.
#
# ``module`` names the Python module that holds a function the game does
# not bind into its default store. A compiled scene runs in that store, so
# for such an entry the compiled file opens with
# ``from <module> import <name>`` in an ``init python`` block, the way the
# game's own .rpy files reach the same functions. Leave it out for a name the
# store already has (TNH binds most of them in game/definitions/core.rpy).
#
# ``retired`` maps a name the game removed or renamed to the hint the
# validator shows when a scene still uses it: a writer upgrading an older
# scene learns what replaced it instead of being offered a near-miss
# spelling. A retired name is not callable.
source: TNH base game
generated_at: '2026-11-05'
functions:
  # -- Approval -------------------------------------------------------------
  # The real function takes five more parameters (extra_condition, multiplier,
  # default, gate, public) that are deliberately not declared here: every
  # declared parameter is emitted into the call, so exposing them would write
  # `check_approval(A, None, 500, None, 1.0, (0, 0), True, False)` for no gain.
  # The defaults below are load-bearing for the same reason — without them
  # the builder emits an empty argument (`check_approval(A, , )`) when a field
  # is left untouched.
  - name: check_approval
    category: Approval
    label: "Love / trust (combined or by tier)"
    signature: "check_approval(Character, flavor: str | None = None, threshold: str | int | None = None) -> bool | int | float"
    notes: |
      The full approval check, for what the simple Love / Trust check cannot
      say. Leave flavor at None to test love and trust ADDED TOGETHER; set it
      to "love" or "trust" for one axis alone. threshold takes either a plain
      number, or the name of one of the character's relationship thresholds
      ("friendship", "dating", "relationship", "love") — the named form checks
      love AND trust against that tier's own pair of values, which is how the
      game gates its own content. Left at None it returns the raw number
      instead, so use the Compare row.
    param_choices:
      flavor:
        - "None"
        - '"love"'
        - '"trust"'
      threshold:
        - "None"
        - '"warm"'
        - '"friendship"'
        - '"dating"'
        - '"relationship"'
        - '"love"'
    source_file: game/core/characters/approval.py
    source_line: 220

  # -- Relationships ----------------------------------------------------------
  - name: are_friends
    category: Relationships
    label: "Friends (a group, at a tier)"
    signature: "are_friends(Characters, level: int = 1) -> bool"
    notes: |
      True when EVERY character's opinion of the rest of the group reaches
      `level`. An opinion is the game's own measure: the friendship tier,
      softened by attraction and lowered by jealousy over the player's
      partners, then pulled toward the member liked least. The simple
      Friendship check is this function with two characters at level 1; use
      this one to check a whole group, or to demand more than plain
      friendship. Scale: 1 friends, 2 good friends, 3 best friends.
    param_choices:
      level:
        - "1"
        - "2"
        - "3"
    source_file: game/core/friendships/mechanics.py
    source_line: 295
  # Two entries, not one. `knows_about` does not refine the question, it
  # replaces it: left at the game's default the call also walks every OTHER
  # partner and fails on the first one who has not been told about the
  # character being asked about. So "is she my girlfriend" returns False for
  # someone who *is* a partner, as soon as a second partner exists who does
  # not know. That is a polyamory-disclosure audit — a real thing to ask,
  # and a different goal, so it gets its own name instead of a boolean the
  # writer has to know the base game to interpret.
  #
  # `Characters` is declared "pick" because this function asks about named
  # characters. The signature-derived default (a required collection leads
  # with "everyone present here") is right for are_friends and
  # needs_to_change, and here would ask "is everyone in the room my
  # partner".
  - name: are_Characters_in_Partners
    category: Relationships
    label: "In a relationship"
    signature: "are_Characters_in_Partners(Characters, knows_about: bool = True) -> bool"
    notes: |
      True if every listed character is one of the player's partners. With
      knows_about (default True) it also requires the partners to know about
      each other's relationship with the player; set it False to skip that.
    param_collection_mode:
      Characters: pick
    variants:
      - label: "In a relationship"
        fixed:
          knows_about: "False"
        notes: |
          True when every character you list is one of the player's
          partners. This is the plain "are they together" check — the game
          asks it as `JeanGrey in Partners` in hundreds of its own
          conditions. It does not care who else knows.
      - label: "In a relationship, and the others know"
        fixed:
          knows_about: "True"
        notes: |
          Everyone you list is a partner of the player AND every other
          partner has been told about them. Use it for a scene that assumes
          the situation is out in the open — with only one partner it is the
          same as the plain check, with two it also asks whether the player
          has come clean. It is False while a disclosure is still pending,
          even though the relationship itself is real.
    source_file: game/core/friendships/mechanics.py
    source_line: 304
  - name: get_best_Friend
    category: Relationships
    label: "Best friend (of a group)"
    signature: "get_best_Friend(Character, Characters) -> Character | None"
    notes: |
      Of the characters in the group, the one the first character likes most
      (highest effective friendship). Returns a Character, or None when the
      group is empty — in an [[if]] it is truthy once someone qualifies.
    source_file: game/core/friendships/mechanics.py
    source_line: 350
  # The 4 below return a FriendshipTier (IntEnum: Enemies=-2, Rivals=-1,
  # Acquaintances=0, Friends=1, GoodFriends=2, BestFriends=3), so a writer
  # compares against a plain integer, e.g. get_effective_friendship(A, B)
  # >= 2 for "at least good friends". FriendshipTier.Friends etc. can't be
  # used as a bare name — the compiler would resolve it as scene-local state.
  # Params are typed "A: Character, B: Character" (not the bare "Character"
  # name run_operations.yaml uses) so the editor's per-parameter form renders
  # a character-picker dropdown for both, not just a first bare-named one.
  - name: get_effective_friendship
    category: Relationships
    label: "Effective friendship (tier)"
    signature: "get_effective_friendship(A: Character, B: Character) -> FriendshipTier"
    notes: |
      The pair's tier after the stronger side's animosity. Returns a tier
      number — use the Compare row (e.g. `>= 2`). Scale: enemies=-2,
      rivals=-1, acquaintances=0, friends=1, good friends=2, best friends=3.
    source_file: game/core/friendships/mechanics.py
    source_line: 162
  - name: get_friendship
    category: Relationships
    label: "Friendship, as one sees it (tier)"
    signature: "get_friendship(A: Character, B: Character) -> FriendshipTier"
    notes: |
      The tier as A sees it, after A's own animosity (one-directional, not
      symmetric: how A sees B is not how B sees A). Returns a tier number —
      use the Compare row. Scale: enemies=-2 ... best friends=3.
    source_file: game/core/friendships/mechanics.py
    source_line: 155
  - name: get_base_friendship
    category: Relationships
    label: "Base friendship (tier)"
    signature: "get_base_friendship(A: Character, B: Character) -> FriendshipTier"
    notes: |
      The pair's tier from the friendship score alone, ignoring animosity.
      Returns a tier number — use the Compare row. Scale: enemies=-2 ...
      best friends=3.
    source_file: game/core/friendships/mechanics.py
    source_line: 169
  - name: get_max_friendship
    category: Relationships
    label: "Max friendship reached (tier)"
    signature: "get_max_friendship(A: Character, B: Character) -> FriendshipTier"
    notes: |
      Highest tier the pair ever reached. Returns a tier number — use the
      Compare row. Scale: enemies=-2 ... best friends=3.
    module: core.friendships
    source_file: game/core/friendships/mechanics.py
    source_line: 176

  # -- Character status ---------------------------------------------------
  - name: has_seen_Player_recently
    category: Character status
    label: "Seen the player recently"
    signature: "has_seen_Player_recently(Character) -> bool"
    notes: |
      True if the character has seen the player more than once recently, or
      at all in the last time-of-day period outside the morning — TNH has 4
      periods per day, so "recently" means the current or last period, not a
      number of days.
    source_file: game/core/characters/utilities.py
    source_line: 105
  - name: is_close_by
    category: Character status
    signature: "is_close_by(Character) -> bool"
    source_file: game/core/characters/utilities.py
    source_line: 95

  # -- Location -----------------------------------------------------------
  # No function here: TNH 0.9c.beta.28 reads the room through attributes of
  # the location object, which a condition can use directly —
  # `JeanGrey in Player.Location.Present` (in the room),
  # `Player.Location.Visible` (plus the background crowd),
  # `Player.Location.Owner == JeanGrey` (whose room it is). The Condition
  # Builder writes the first two for a character-collection parameter.

  # -- Time ---------------------------------------------------------------
  - name: get_time_since
    category: Time
    label: "Periods since a date (4/day)"
    signature: "get_time_since(date: tuple[int, int]) -> int"
    notes: |
      How long since a past moment, counted in time-of-day slots (about 4 per
      day, so 4 ≈ one full day — this is NOT a plain day count). Compare it,
      e.g. >= 4 for "about a day ago". Normally you measure from when an
      event last happened — pick the character and the event, and the moment
      is read from her history. Careful: an event that never happened reads as
      a very long time ago, so check it happened at all first. The "specific
      day" form is for a day number you already have.
    module: core.time
    source_file: game/core/time/utilities.py
    source_line: 117

  # -- Clothing (writer-facing checks) ------------------------------------
  # The game's trailing `travel` parameter is not declared: every declared
  # parameter is emitted, and its default (False) is what a condition wants.
  - name: needs_to_change
    category: Clothing
    label: "Needs to change clothes"
    signature: "needs_to_change(Characters, Arrivals: Iterable[CharacterClass] = None, clothing: bool = True, mess: bool = True, check: bool = True) -> bool"
    notes: |
      Whether any of the characters needs to fix their outfit (too revealing
      for who is arriving) or clean up a mess. Arrivals are the characters
      entering the scene; one who is comfortable (friends, level >= 2) with
      all of them is skipped. Leave check on True: it makes this a pure
      question. The game's own default is False, which actually PLAYS the
      change / cleanup interaction — to do that on purpose, use
      [[run needs_to_change(...)]] instead of an [[if]].
    source_file: game/core/clothing/appropriateness.py
    source_line: 103

  # -- History ------------------------------------------------------------
  - name: chance_of_repeat
    category: History
    label: "Chance of a repeat event"
    signature: "chance_of_repeat(History, item: str, chance: float = 0, limit_day_chance: float = 1.0, limit_day: int = 5) -> float"
    notes: |
      Returns a probability (0..1), not a yes/no: how likely a repeatable event
      should fire again, growing the longer since it last happened. It is 0
      on the day of the event, then rises from chance (default 0) to
      limit_day_chance (default 1.0) over limit_day days (default 5). Use it
      to space out a repeat — compare it (e.g. >= 0.5) or roll against it in
      mod code. Pick whose history to read in the History row; item is picked
      from the known history events.
    param_choices:
      History:
        source: characters
        suffix: ".History"
      item:
        source: history_events
        quote: true
    module: core.base
    source_file: game/core/base/history.py
    source_line: 17

